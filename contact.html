    <script src="js/data.js"></script>

    <script>
        /***********************************************************
         * [EmailJS 설정 가이드]
         * 1. https://www.emailjs.com/ 에 접속하여 회원가입/로그인 합니다.
         * 2. 'Email Services' 탭에서 'Add New Service'를 클릭하고 Gmail 등을 연결합니다. (Service ID 획득)
         * 3. 'Email Templates' 탭에서 새 템플릿을 만듭니다. (Template ID 획득)
         *    - 템플릿 내용 예시:
         *      {{from_name}} 님으로부터 문의가 왔습니다.
         *      이메일: {{reply_to}}
         *      제목: {{subject}}
         *      내용: {{message}}
         * 4. 'Account' > 'General' 탭에서 Public Key를 확인합니다.
         * 5. 아래 변수들에 해당 값들을 복사해서 붙여넣으세요.
         ***********************************************************/

        const EMAILJS_PUBLIC_KEY = "wlsx4npEJ5ho8n9a5";
        const EMAILJS_SERVICE_ID = "service_o6qwngk";
        const EMAILJS_TEMPLATE_ID = "template_8ksvv0d";

        // EmailJS 초기화
        (function () {
            if (EMAILJS_PUBLIC_KEY !== "여기에_Public_Key_입력") {
                emailjs.init(EMAILJS_PUBLIC_KEY);
            }
        })();

        // 입력 필드 겹침 방지 및 활성화 효과 (JS로 확실하게 제어)
        document.querySelectorAll('.form-input, .form-textarea').forEach(element => {
            // 초기 로드 시 값이 있으면 클래스 추가
            if (element.value !== '') {
                element.parentElement.classList.add('has-value');
            }

            // 입력 시 클래스 추가/제거
            element.addEventListener('input', function () {
                if (this.value !== '') {
                    this.parentElement.classList.add('has-value');
                } else {
                    this.parentElement.classList.remove('has-value');
                }
            });

            // 포커스 시 활성화
            element.addEventListener('focus', function () {
                this.parentElement.classList.add('focused');
            });

            // 블러 시 비활성화 (값 없으면 has-value도 제거됨)
            element.addEventListener('blur', function () {
                this.parentElement.classList.remove('focused');
            });
        });

        // 이메일 발송 함수
        function sendEmail(e) {
            e.preventDefault();

            // 설정값 확인
            if (EMAILJS_PUBLIC_KEY === "여기에_Public_Key_입력") {
                alert("EmailJS 설정이 필요합니다. html 파일을 열어 Public Key 등을 입력해주세요.");
                return;
            }

            const sendBtn = document.querySelector('.send-btn');
            const originalBtnText = sendBtn.innerText;

            // 버튼 로딩 상태
            sendBtn.innerText = "SENDING...";
            sendBtn.disabled = true;
            sendBtn.style.opacity = "0.7";

            // 폼 데이터 가져오기
            const templateParams = {
                from_name: document.getElementById('name').value,
                reply_to: document.getElementById('email').value, // 이메일 답장을 위해 필요
                subject: "홈페이지 문의", // Subject 필드가 없으므로 고정값 사용
                message: document.getElementById('message').value
            };

            // EmailJS 전송
            emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams)
                .then(function () {
                    alert("문의가 전송되었습니다. 빠른 시일 내에 답변드리겠습니다.");
                    document.getElementById('contactForm').reset();
                    // 리셋 후 클래스 제거
                    document.querySelectorAll('.form-group').forEach(grp => grp.classList.remove('has-value'));
                }, function (error) {
                    console.error('FAILED...', error);
                    alert("전송에 실패했습니다. 이메일로 직접 문의해주세요.");
                })
                .finally(function () {
                    // 버튼 복구
                    sendBtn.innerText = originalBtnText;
                    sendBtn.disabled = false;
                    sendBtn.style.opacity = "1";
                });
        }
    </script>
