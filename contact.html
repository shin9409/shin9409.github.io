<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — LOOKUP MEDIA</title>
    <meta name="description" content="LOOKUP MEDIA 프로젝트 문의 및 연락처.">
    <meta property="og:title" content="Contact — LOOKUP MEDIA">
    <meta property="og:type" content="website">
    <link rel="icon" href="images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&display=swap" media="print" onload="this.media='all'"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="css/style.css?v=20261022-type">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body data-page="contact">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header site-header--solid" id="site-header"><div class="site-header__inner"><a href="index.html" class="wordmark" aria-label="LOOKUP MEDIA home">LOOK<span>UP</span> MEDIA</a><nav class="site-nav" id="primary-nav" aria-label="Primary navigation"><a href="index.html">Home</a><a href="works.html">Works</a><span id="dynamic-nav"></span><a href="contact.html" aria-current="page">Contact</a></nav><button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav"><span class="menu-toggle__label">Menu</span><span class="menu-toggle__lines" aria-hidden="true"></span></button></div></header>
    <main id="main-content">
        <section class="contact-page shell">
            <div class="contact-page__layout">
                <div class="contact-page__intro">
                    <h1>Contact</h1>
                    <p class="contact-page__lead">제작 · 조명 문의<br>내용을 남겨주시면 확인 후 연락드리겠습니다.</p>
                    <aside class="contact-details" aria-label="Contact details">
                        <div><span>Email</span><a id="contact-email" href="#">Email</a></div>
                        <div><span>Phone</span><a id="contact-phone" href="#">Phone</a></div>
                        <div><span>Instagram</span><a id="contact-instagram" href="#" target="_blank" rel="noreferrer">@lookupmedia_ ↗</a></div>
                        <div><span>Studio</span><p id="contact-address">Studio address</p></div>
                    </aside>
                </div>
                <form class="contact-form" id="contact-form" novalidate>
                    <div class="contact-form__row">
                        <div class="field"><label for="contact-name">이름 <span>(필수)</span></label><input id="contact-name" name="name" autocomplete="name" placeholder="이름 또는 회사명" aria-describedby="contact-name-error" required><small id="contact-name-error">이름을 입력해 주세요.</small></div>
                        <div class="field"><label for="contact-reply">이메일 <span>(필수)</span></label><input id="contact-reply" name="email" type="email" autocomplete="email" placeholder="name@email.com" aria-describedby="contact-reply-error" required><small id="contact-reply-error">이메일을 확인해 주세요.</small></div>
                    </div>
                    <div class="field field--message"><label for="contact-message">문의 내용 <span>(필수)</span></label><textarea id="contact-message" name="message" rows="4" placeholder="프로젝트 종류, 촬영 일정, 예산 등을 알려주세요." aria-describedby="contact-message-error" required></textarea><small id="contact-message-error">문의 내용을 입력해 주세요.</small></div>
                    <button class="submit-button" type="submit"><span>문의 보내기</span><b aria-hidden="true">↗</b></button>
                    <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
                </form>
            </div>
        </section>
    </main>
    <script src="js/main.js?v=20261022-type" defer></script><script src="js/contact.js?v=20261021-1" defer></script>
</body>
</html>
