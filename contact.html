<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — LOOKUP MEDIA</title>
    <meta name="description" content="LOOKUP MEDIA 프로젝트 문의 및 연락처.">
    <meta property="og:title" content="Contact — LOOKUP MEDIA">
    <meta property="og:type" content="website">
    <link rel="icon" href="images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,100..900&display=swap" media="print" onload="this.media='all'"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" media="print" onload="this.media='all'"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="css/style.css?v=20260728-2">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body data-page="contact">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header site-header--solid" id="site-header"><div class="site-header__inner"><a href="index.html" class="wordmark" aria-label="LOOKUP MEDIA home">LOOK<span>UP</span> MEDIA</a><nav class="site-nav" id="primary-nav" aria-label="Primary navigation"><a href="index.html">Home</a><a href="works.html">Works</a><span id="dynamic-nav"></span><a href="contact.html" aria-current="page">Contact</a></nav><button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav"><span class="menu-toggle__label">Menu</span><span class="menu-toggle__lines" aria-hidden="true"></span></button></div></header>
    <main id="main-content">
        <section class="contact-page shell">
            <div class="contact-page__layout">
                <div class="contact-page__intro reveal">
                    <p class="eyebrow">CONTACT / LOOKUP MEDIA</p>
                    <h1>Let's make<br>the next scene.</h1>
                    <p class="contact-page__lead">프로젝트에 대해 간단히 남겨주세요.<br>확인 후 빠르게 연락드리겠습니다.</p>
                    <aside class="contact-details" aria-label="Contact details">
                        <div><span>Email</span><a id="contact-email" href="#">Email</a></div>
                        <div><span>Phone</span><a id="contact-phone" href="#">Phone</a></div>
                        <div><span>Instagram</span><a id="contact-instagram" href="#" target="_blank" rel="noreferrer">@lookupmedia_ ↗</a></div>
                        <div><span>Studio</span><p id="contact-address">Studio address</p></div>
                    </aside>
                </div>
                <form class="contact-form reveal" id="contact-form" novalidate>
                    <div class="contact-form__row">
                        <div class="field"><label for="contact-name">Name</label><input id="contact-name" name="name" autocomplete="name" placeholder="Your name" required><small>이름을 입력해 주세요.</small></div>
                        <div class="field"><label for="contact-reply">Email</label><input id="contact-reply" name="email" type="email" autocomplete="email" placeholder="name@email.com" required><small>이메일을 확인해 주세요.</small></div>
                    </div>
                    <div class="field field--message"><label for="contact-message">Project</label><textarea id="contact-message" name="message" rows="4" placeholder="프로젝트 종류, 일정, 예산 등 편하게 적어주세요." required></textarea><small>문의 내용을 입력해 주세요.</small></div>
                    <button class="submit-button" type="submit"><span>Send inquiry</span><b>↗</b></button>
                    <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
                </form>
            </div>
        </section>
    </main>
    <script src="js/main.js?v=20260728-2" defer></script><script src="js/contact.js" defer></script>
</body>
</html>
